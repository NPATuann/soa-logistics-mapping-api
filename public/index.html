<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOA Seminar - Google Places API Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1 fw-bold">📍 SOA Seminar - Google Places API</span>
      <span class="badge" id="modeBadge">Initializing...</span>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-dark">Location Lookup & Tracking System</h3>
      <p class="text-muted small">Logistics & Mapping Services - Group 3 (Khang, Tuan, Alex)</p>
    </div>

    <ul class="nav nav-tabs mb-4 justify-content-center" id="apiTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-pane">
          🔍 1. Place Search
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="nearby-tab" data-bs-toggle="tab" data-bs-target="#nearby-pane">
          📍 2. Nearby Locations
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="details-tab" data-bs-toggle="tab" data-bs-target="#details-pane">
          ℹ️ 3. Business Information
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="search-pane">
        <div class="card p-3 mb-4">
          <form id="formSearch" class="row g-2">
            <div class="col-md-10">
              <input type="text" class="form-control" id="searchQuery" placeholder="Enter search keyword (e.g., Ton Duc Thang University, District 7 Restaurants)..." required>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100 fw-semibold">Search</button>
            </div>
          </form>
        </div>
        <div id="searchResults" class="row g-3"></div>
      </div>

      <div class="tab-pane fade" id="nearby-pane">
        <div class="card p-3 mb-4">
          <form id="formNearby" class="row g-2">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Landmark (Location Name / Address)</label>
              <input type="text" class="form-control" id="nearbyLocationName" placeholder="e.g., Ben Thanh Market, Landmark 81, TDTU..." value="Ton Duc Thang University" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Radius (Meters)</label>
              <input type="number" class="form-control" id="nearbyRadius" value="1000" min="100" max="50000" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Location Type</label>
              <input type="text" class="form-control" id="nearbyType" placeholder="e.g., cafe, restaurant, bank" value="cafe">
            </div>
            <div class="col-12 mt-2">
              <button type="submit" class="btn btn-success w-100 fw-semibold">Scan Nearby Locations</button>
            </div>
          </form>
        </div>
        <div id="nearbyResults" class="row g-3"></div>
      </div>

      <div class="tab-pane fade" id="details-pane">
        <div class="card p-3 mb-4">
          <form id="formDetails" class="row g-2">
            <div class="col-md-10">
              <input type="text" class="form-control font-monospace" id="detailsPlaceId" placeholder="Enter Place ID..." required>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-info text-white w-100 fw-semibold">Get Details</button>
            </div>
          </form>
        </div>
        <div id="detailsResult"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
